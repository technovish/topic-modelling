<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Credentials - Data Analytics Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .error-icon {
            color: #ef4444;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }
        .back-btn {
            margin-top: 10px;
            background-color: transparent !important;
            color: #3b82f6 !important;
            border: 2px solid #3b82f6 !important;
            font-weight: 600;
        }
        .back-btn:hover {
            background-color: #eff6ff !important;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card" style="text-align: center;">
            <div class="error-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
            </div>
            <h1 class="login-title">Sign In Failed</h1>
            <p class="login-subtitle" style="margin-bottom: 25px; color: #ef4444;">We couldn't verify your credentials. The email or password entered was incorrect.</p>
            
            <a href="/login" style="text-decoration: none;">
                <button type="button" class="login-btn back-btn">Return to Login</button>
            </a>
        </div>
        <div class="login-footer">
            © 2024 Intellize Technologies | <a href="#">Privacy Policy</a>
        </div>
    </div>
</body>
</html>
